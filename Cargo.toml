[workspace]
resolver = "2"
members = ["crates/autocitefetch", "crates/autocitefetch-std", "crates/autocitefetch-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"
repository = "https://github.com/phfaist/autocitefetch"
keywords = ["citation", "bibliography", "csl-json", "arxiv", "doi"]

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
xmlparser = { version = "0.13", default-features = false }

autocitefetch = { path = "crates/autocitefetch", version = "0.1.0" }
autocitefetch-std = { path = "crates/autocitefetch-std", version = "0.1.0" }
