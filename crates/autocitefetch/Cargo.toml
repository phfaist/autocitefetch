[package]
name = "autocitefetch"
description = "no_std automatic retrieval of bibliographic citations (arXiv, DOI, …) into CSL-JSON, with pluggable fetch and cache backends."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["no-std", "wasm", "science", "text-processing"]
# Tests stay in the repository; they are not needed to build or use the crate.
exclude = ["tests/"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hashbrown = { workspace = true }
futures-util = { workspace = true }
xmlparser = { workspace = true }

[features]
default = []

# No `[dev-dependencies]` on purpose. `serde_json = "1"` here would use default
# features, pulling in `serde_json/std`; under resolver v2 that unifies with the
# normal dependency for the test build, so `cargo test -p autocitefetch` would
# compile this `#![no_std]` crate against a std-enabled serde_json — the exact
# configuration it promises never to use. It is redundant anyway: the normal
# dependency is already linkable from `tests/` and `examples/`.
