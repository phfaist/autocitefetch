[package]
name = "autocitefetch-std"
description = "std backends for autocitefetch: blocking HTTP fetcher, clock, timer, single-file cache."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["science", "caching", "text-processing"]
# Tests stay in the repository; they are not needed to build or use the crate.
exclude = ["tests/"]

[dependencies]
autocitefetch = { workspace = true }
serde_json = { workspace = true }
# The instance key of a `SessionCache` is any `Serialize` value of the host.
serde = { workspace = true }
# The storage engine (the JSONL store, locks and merges) and the manager layer
# for host-managed caches. `std` gives the real filesystem (`StdFs`), the system
# clock and `cachette::Manager`.
cachette = { workspace = true, features = ["std"] }
# Optional blocking HTTP backend. Gated behind the `http` feature so the crate
# still builds with no network/TLS dependency (see `UreqFetcher`).
ureq = { version = "2", optional = true }

[dev-dependencies]
# Test-only: scratch directories for the cache/fetcher/bib tests.
tempfile = "3"

[features]
default = ["http"]
# A blocking HTTP `Fetcher` (`UreqFetcher`) backed by `ureq`.
http = ["dep:ureq"]

[[example]]
name = "resolve"
required-features = ["http"]

# docs.rs builds default features only; be explicit so feature-gated items
# (the `http` feature's `UreqFetcher`) always appear in the published docs.
[package.metadata.docs.rs]
all-features = true
